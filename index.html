<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ten Questions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Ten Questions</h1>

    <!-- Screen 1: choose a topic -->
    <div id="setup">
      <p>Choose a topic and answer 10 multiple choice questions.</p>
      <label for="topic">Topic</label>
      <select id="topic">
        <option value="Java">Java Programming</option>
        <option value="OS">Operating Systems</option>
        <option value="DBMS">DBMS</option>
      </select>
      <button id="startBtn">Start Quiz</button>
    </div>

    <!-- Screen 2: the quiz -->
    <div id="quiz" class="hidden">
      <p id="count"></p>
      <h2 id="question"></h2>
      <div id="options"></div>
      <p id="explanation"></p>
      <button id="next" class="hidden">Next</button>
    </div>

    <!-- Screen 3: final score -->
    <div id="result" class="hidden">
      <h2 id="scoreText"></h2>
      <button id="restart">Try Another Quiz</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
